semantic_model:
  - name: mypa_service
    description: 智能客服分析语义层
    ai_context:
      instructions: 用于智能客服相关的分析
    datasets:
      - name: 智能服务量表
        source: dwd.dws_crm_mypa_service_exploded_di
    metrics:
      - name: 智能服务量
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                COUNT(DISTINCT CASE WHEN channel IN ('MYPA', '端外智能体调用') THEN router_id END)
        filter: is_common_calc = 1 AND channel <> 'FAQ'
      - name: 按键评价量
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                COUNT(DISTINCT IF(is_online_sat = '1', router_id, NULL))
        filter: is_common_calc = 1 AND channel <> 'FAQ'
      - name: 按键评价满意量
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                COUNT(DISTINCT IF(is_online_sat_satisfaction = '1', router_id, NULL))
        filter: is_common_calc = 1 AND channel <> 'FAQ'
    dimensions:
      - name: dt
        data_type: string
        format: yyyyMMdd
        display_name: 业务日期
        description: 业务日期，分区字段，格式 yyyyMMdd
        is_time: true
      - name: channel
        data_type: string
        display_name: 渠道
