version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-data-agent-backend:latest
    container_name: smart-data-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override anything sensitive here; .env values are loaded first then these take precedence.
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: "0.0.0.0"
      PORT: "8000"
      # SQLite checkpointer (file inside the mounted volume).
      CHECKPOINTER: ${CHECKPOINTER:-sqlite}
      SQLITE_PATH: /app/data/chat.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - agent-net

  # Optional: a tiny Redis for distributed rate-limiting / cache. Uncomment to enable.
  # redis:
  #   image: redis:7-alpine
  #   container_name: smart-data-agent-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  data: