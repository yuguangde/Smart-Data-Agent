semantic_model:
  - name: debit_card_specializing
    display_name: 燃料卡 B2B 语义模型
    description: |
      加油站/燃料卡 B2B 业务语义模型，覆盖客户、加油站网点、商品、客户月度消费汇总
      以及 4 天抽样交易明细。
      本模型同时提供表结构、join 关系、业务规则与典型 SQL 模式，可直接用于支撑 NL2SQL 生成。

    # ---------------- 表关系 / join 路径 ----------------
    relationships:
      - from: customers.CustomerID
        to: yearmonth.CustomerID
        type: one_to_many
        description: 一个客户在 yearmonth 中有多个历史月份记录。
      - from: customers.CustomerID
        to: transactions_1k.CustomerID
        type: one_to_many
        description: 一个客户有多笔抽样交易明细。
      - from: gasstations.GasStationID
        to: transactions_1k.GasStationID
        type: one_to_many
        description: 一个加油站有多笔交易。
      - from: products.ProductID
        to: transactions_1k.ProductID
        type: one_to_many
        description: 一个商品可出现在多笔交易中。

    # ---------------- 业务规则 / 易错点 ----------------
    business_rules:
      - "月度消费统计必须使用 yearmonth 表，不要对 transactions_1k.Date 做月度聚合（transactions 只有 2012-08-23 ~ 2012-08-26 的 4 天抽样数据）。"
      - "yearmonth.Date 是 YYYYMM 文本格式。取年：SUBSTR(Date, 1, 4)；取月：SUBSTR(Date, 5, 2)。对该字段禁用 strftime、BETWEEN '2013-08' 等标准日期写法。"
      - "transactions_1k.Date 是标准日期 YYYY-MM-DD，仅用于交易明细分析。"
      - "transactions_1k.Price 是交易总价，不是单价；单价 = Price / Amount。"
      - "average monthly consumption 通常指 AVG(Consumption) / 12。"
      - " customers.Segment 表示客户规模层级（SME/LAM/KAM）；gasstations.Segment 表示加油站档次（Premium/Discount/Value for money/Other/Noname），含义完全不同。"
      - "Country 取值为 CZE/SVK，不是 Czech Republic / Slovakia 等完整国名。"
      - "Currency 取值为 CZK/EUR，分别表示捷克克朗和欧元。"
      - "top spending customer 的金额口径使用 SUM(Price)，不使用 SUM(Amount)，也不使用 SUM(Price * Amount)。"

    # ---------------- 典型正确 SQL 模式 ----------------
    sql_patterns:
      - name: 按客户 Segment 统计某年度消费总量
        sql: |
          SELECT T1.Segment, SUM(T2.Consumption) AS total
          FROM customers AS T1
          INNER JOIN yearmonth AS T2 ON T1.CustomerID = T2.CustomerID
          WHERE SUBSTR(T2.Date, 1, 4) = '2013'
          GROUP BY T1.Segment;
      - name: 找到某 Segment 在某年度消费最少的客户
        sql: |
          SELECT T1.CustomerID
          FROM customers AS T1
          INNER JOIN yearmonth AS T2 ON T1.CustomerID = T2.CustomerID
          WHERE T1.Segment = 'LAM' AND SUBSTR(T2.Date, 1, 4) = '2012'
          GROUP BY T1.CustomerID
          ORDER BY SUM(T2.Consumption) ASC
          LIMIT 1;
      - name: 某客户群某年度月均消费量
        sql: |
          SELECT AVG(T2.Consumption) / 12
          FROM customers AS T1
          INNER JOIN yearmonth AS T2 ON T1.CustomerID = T2.CustomerID
          WHERE SUBSTR(T2.Date, 1, 4) = '2013' AND T1.Segment = 'SME';
      - name: 按结算货币找消费量最高的年份
        sql: |
          SELECT SUBSTR(T2.Date, 1, 4)
          FROM customers AS T1
          INNER JOIN yearmonth AS T2 ON T1.CustomerID = T2.CustomerID
          WHERE T1.Currency = 'CZK'
          GROUP BY SUBSTR(T2.Date, 1, 4)
          ORDER BY SUM(T2.Consumption) DESC
          LIMIT 1;
      - name: 按国家统计加油站销售的商品种类
        sql: |
          SELECT DISTINCT T3.Description
          FROM transactions_1k AS T1
          INNER JOIN gasstations AS T2 ON T1.GasStationID = T2.GasStationID
          INNER JOIN products AS T3 ON T1.ProductID = T3.ProductID
          WHERE T2.Country = 'CZE';

    datasets:
      - name: customers
        source: customers
        display_name: 客户主数据
        description: |
          企业客户（燃料卡持卡人）主数据。
          DDL: CREATE TABLE customers (CustomerID INTEGER UNIQUE NOT NULL PRIMARY KEY, Segment TEXT, Currency TEXT)
        primary_key:
          - CustomerID
        notes:
          - CustomerID 为客户唯一标识、主键。
          - Segment 表示客户规模层级，Currency 表示结算货币。
        dimensions:
          - name: CustomerID
            display_name: 客户 ID
            data_type: integer
            description: 客户唯一标识，主键。
          - name: Segment
            display_name: 客户细分
            data_type: string
            description: |
              客户规模层级。SME=中小企业，LAM=大客户，KAM=重点客户。
              常见问题中会直接用 SME/LAM/KAM 指代客户群体；它属于客户维度，不是 Currency。
            values:
              - SME
              - LAM
              - KAM
          - name: Currency
            display_name: 结算货币
            data_type: string
            description: 客户结算货币，CZK 为捷克克朗，EUR 为欧元。
            values:
              - CZK
              - EUR
        metrics:
          - name: customer_count
            display_name: 客户数
            description: 去重客户数量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: COUNT(DISTINCT CustomerID)

      - name: gasstations
        source: gasstations
        display_name: 加油站网点
        description: |
          加油站网点信息，包括国家、连锁品牌与档次定位。
          DDL: CREATE TABLE gasstations (GasStationID INTEGER UNIQUE NOT NULL PRIMARY KEY, ChainID INTEGER, Country TEXT, Segment TEXT)
        primary_key:
          - GasStationID
        notes:
          - GasStationID 为加油站唯一标识、主键。
          - 此处的 Segment 表示加油站档次，与客户表 Segment 含义不同。
        dimensions:
          - name: GasStationID
            display_name: 加油站 ID
            data_type: integer
          - name: ChainID
            display_name: 连锁品牌 ID
            data_type: integer
          - name: Country
            display_name: 国家
            data_type: string
            description: 国家代码，CZE=捷克，SVK=斯洛伐克，不是完整国名。
            values:
              - CZE
              - SVK
          - name: Segment
            display_name: 加油站档次
            data_type: string
            description: 加油站定位/档次；与客户表的 Segment 含义不同。
            values:
              - Premium
              - Discount
              - "Value for money"
              - Other
              - Noname
        metrics:
          - name: station_count
            display_name: 加油站数
            description: 去重加油站数量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: COUNT(DISTINCT GasStationID)

      - name: products
        source: products
        display_name: 商品/油品
        description: |
          商品主数据。
          DDL: CREATE TABLE products (ProductID INTEGER UNIQUE NOT NULL PRIMARY KEY, Description TEXT)
        primary_key:
          - ProductID
        notes:
          - ProductID 为商品唯一标识、主键。
          - Description 为本地语言（捷克语、英语等），例如 Diesel、Natural、AdBlue。
        dimensions:
          - name: ProductID
            display_name: 商品 ID
            data_type: integer
          - name: Description
            display_name: 商品描述
            data_type: string
            description: 商品/油品描述，例如 Nafta、Natural、Diesel、AdBlue 等。
        metrics:
          - name: product_count
            display_name: 商品数
            description: 去重商品数量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: COUNT(DISTINCT ProductID)

      - name: yearmonth
        source: yearmonth
        display_name: 客户月度消费汇总
        description: |
          核心事实表。按客户 + 月份汇总消费量。
          DDL: CREATE TABLE yearmonth (CustomerID INTEGER NOT NULL, Date TEXT NOT NULL, Consumption REAL, PRIMARY KEY (Date, CustomerID), FOREIGN KEY (CustomerID) REFERENCES customers(CustomerID))
        primary_key:
          - Date
          - CustomerID
        foreign_keys:
          - column: CustomerID
            references: customers.CustomerID
        notes:
          - 主键为 (Date, CustomerID)。
          - Date 字段格式为 YYYYMM 文本（例如 201207），日期范围 201112 ~ 201311。
          - 月度消费统计必须使用本表，不要求助于 transactions_1k.Date。
        dimensions:
          - name: CustomerID
            display_name: 客户 ID
            data_type: integer
            description: 客户 ID，外键关联 customers.CustomerID。
          - name: Date
            display_name: 月份
            data_type: string
            format: yyyyMM
            is_time: true
            description: |
              月份，YYYYMM 文本格式。不是标准日期，禁用 strftime。
              正确做法：SUBSTR(Date, 1, 4) 取年，SUBSTR(Date, 5, 2) 取月。
          - name: Consumption
            display_name: 当月消费量
            data_type: number
            description: 客户当月的消费量汇总。
        metrics:
          - name: total_consumption
            display_name: 消费总量
            description: 消费量合计。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SUM(Consumption)
          - name: avg_monthly_consumption
            display_name: 月均消费量
            description: |
              月均消费量 = AVG(Consumption) / 12。
              常用于计算某年度/某客户群的平均每月消费量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: AVG(Consumption) / 12
          - name: max_monthly_consumption
            display_name: 最大月消费量
            description: 最大月度消费量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: MAX(Consumption)
          - name: min_monthly_consumption
            display_name: 最小月消费量
            description: 最小月度消费量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: MIN(Consumption)

      - name: transactions_1k
        source: transactions_1k
        display_name: 交易明细
        description: |
          抽样交易明细。
          DDL: CREATE TABLE transactions_1k (TransactionID INTEGER PRIMARY KEY AUTOINCREMENT, Date DATE, Time TEXT, CustomerID INTEGER, CardID INTEGER, GasStationID INTEGER, ProductID INTEGER, Amount INTEGER, Price REAL)
        primary_key:
          - TransactionID
        foreign_keys:
          - column: CustomerID
            references: customers.CustomerID
          - column: GasStationID
            references: gasstations.GasStationID
          - column: ProductID
            references: products.ProductID
        notes:
          - 仅包含 2012-08-23 至 2012-08-26 共 1000 条抽样记录。
          - Price 为交易总价（不是单价），金额/花费口径使用 Price。
          - 不要用它做月度消费统计。
        dimensions:
          - name: TransactionID
            display_name: 交易 ID
            data_type: integer
          - name: Date
            display_name: 交易日期
            data_type: date
            format: yyyy-MM-dd
            is_time: true
            description: 交易日期，标准日期格式 YYYY-MM-DD。
          - name: Time
            display_name: 交易时间
            data_type: string
            description: 交易时间，例如 16:25:00。
          - name: CustomerID
            display_name: 客户 ID
            data_type: integer
            description: 客户 ID，外键关联 customers.CustomerID。
          - name: CardID
            display_name: 卡 ID
            data_type: integer
          - name: GasStationID
            display_name: 加油站 ID
            data_type: integer
            description: 加油站 ID，外键关联 gasstations.GasStationID。
          - name: ProductID
            display_name: 商品 ID
            data_type: integer
            description: 商品 ID，外键关联 products.ProductID。
          - name: Amount
            display_name: 数量
            data_type: integer
          - name: Price
            display_name: 总价
            data_type: number
            description: 交易总价（不是单价），金额/花费口径使用 Price。
        metrics:
          - name: transaction_count
            display_name: 交易笔数
            description: 去重交易数量。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: COUNT(DISTINCT TransactionID)
          - name: total_amount
            display_name: 总数量
            description: 交易商品数量合计。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SUM(Amount)
          - name: total_price
            display_name: 总交易额
            description: 交易金额合计，对应消费金额/花费口径。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: SUM(Price)
          - name: avg_unit_price
            display_name: 平均单价
            description: 平均单价 = AVG(Price / Amount)。
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: AVG(CAST(Price AS REAL) / Amount)
